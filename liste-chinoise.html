<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La liste chinoise</title>
<style>
  :root{--bg:#0a0d12;--card:#141922;--line:#222a36;--txt:#e9eef6;--dim:#8b97a9;--acc:#22c55e;--b1:#38bdf8;--b2:#f59e0b;--b3:#a78bfa;--b4:#f472b6;--b5:#34d399;--b6:#fb923c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 14px 60px;max-width:760px;margin:auto}
  h1{font-size:21px;margin:0 0 3px;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px;line-height:1.5}
  .mapwrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:16px}
  svg{width:100%;height:auto;display:block}
  .branch{margin-bottom:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .bhead{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .bhead b{font-size:14px;flex:1}
  .bhead small{color:var(--dim);font-size:11px}
  .items{display:none;border-top:1px solid var(--line);padding:6px 14px 12px}
  .items.open{display:block}
  .it{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px;line-height:1.45}
  .it input{width:19px;height:19px;accent-color:#22c55e;margin-top:1px;flex:0 0 auto}
  .it.done span{color:var(--dim);text-decoration:line-through}
  .foot{color:#5f6b7d;font-size:11px;text-align:center;margin-top:22px;line-height:1.6}
</style>
</head>
<body>
<h1>La liste chinoise</h1>
<div class="sub">Le but au centre, et tout ce qui y mène autour. Tu coches, ça se garde sur ton téléphone.</div>

<div class="mapwrap">
<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#0f6b3a"/>
    </radialGradient>
  </defs>
  <!-- liens -->
  <g stroke-width="3" opacity=".55">
    <line x1="400" y1="330" x2="400" y2="120" stroke="#38bdf8"/>
    <line x1="470" y1="360" x2="650" y2="215" stroke="#f59e0b"/>
    <line x1="480" y1="420" x2="690" y2="430" stroke="#a78bfa"/>
    <line x1="455" y1="465" x2="600" y2="650" stroke="#f472b6"/>
    <line x1="345" y1="465" x2="200" y2="650" stroke="#34d399"/>
    <line x1="320" y1="400" x2="115" y2="395" stroke="#fb923c"/>
    <line x1="345" y1="360" x2="175" y2="205" stroke="#94a3b8"/>
  </g>
  <!-- centre -->
  <circle cx="400" cy="400" r="86" fill="url(#core)"/>
  <text x="400" y="392" text-anchor="middle" font-family="Arial" font-size="19" font-weight="800" fill="#04170c">ÊTRE LE 1 %</text>
  <text x="400" y="414" text-anchor="middle" font-family="Arial" font-size="12" fill="#062515">argent · corps · tête</text>

  <!-- branches -->
  <g font-family="Arial" font-weight="700" font-size="14" text-anchor="middle">
    <rect x="325" y="72" width="150" height="48" rx="12" fill="#0d2433" stroke="#38bdf8" stroke-width="2"/>
    <text x="400" y="102" fill="#38bdf8">CODE</text>

    <rect x="580" y="185" width="160" height="48" rx="12" fill="#2e2208" stroke="#f59e0b" stroke-width="2"/>
    <text x="660" y="215" fill="#f59e0b">ARGENT</text>

    <rect x="625" y="405" width="160" height="48" rx="12" fill="#1f1838" stroke="#a78bfa" stroke-width="2"/>
    <text x="705" y="435" fill="#a78bfa">CORPS</text>

    <rect x="520" y="625" width="170" height="48" rx="12" fill="#33131f" stroke="#f472b6" stroke-width="2"/>
    <text x="605" y="655" fill="#f472b6">APPARENCE</text>

    <rect x="115" y="625" width="165" height="48" rx="12" fill="#0d2c25" stroke="#34d399" stroke-width="2"/>
    <text x="197" y="655" fill="#34d399">TÊTE</text>

    <rect x="30" y="370" width="170" height="48" rx="12" fill="#331b09" stroke="#fb923c" stroke-width="2"/>
    <text x="115" y="400" fill="#fb923c">DISCIPLINE</text>

    <rect x="80" y="180" width="175" height="48" rx="12" fill="#1b2230" stroke="#94a3b8" stroke-width="2"/>
    <text x="167" y="210" fill="#c7d2e0">LES AUTRES</text>
  </g>
</svg>
</div>

<div id="branches"></div>

<div class="foot">Chaque case cochée reste cochée, même si tu fermes la page.</div>

<script>
const BRANCHES = [
 {n:"CODE", c:"#38bdf8", ob:"Reçu avant le 15 novembre", its:[
   "Réserver sur rdvpermis avec le NEPH",
   "3 examens blancs par jour, noter les scores",
   "Mode panneaux illustrés de l'appli",
   "Refaire les questions ratées, pas de nouvelles séries",
   "35 sur 40 avant de le passer"
 ]},
 {n:"ARGENT", c:"#f59e0b", ob:"1 000 € avant 2027", its:[
   "Créer le compte Stripe (lien de paiement)",
   "Micro-entreprise gratuite sur urssaf.fr",
   "Appeler 5 artisans cette semaine",
   "Un premier site vendu avant le 30 novembre",
   "40 € par mois d'entretien sur chaque site",
   "Deux clients qui renouvellent en décembre"
 ]},
 {n:"CORPS", c:"#a78bfa", ob:"+2 kg de muscle, 10 km sous 57 min", its:[
   "Winter Arc démarré le 9 novembre",
   "Tractions : pyramide lundi, EMOM mercredi, 80 % vendredi",
   "Course longue en distance, 12 à 13 km le lundi",
   "400 m le samedi, jamais deux séances dures d'affilée",
   "2 850 kcal et 150 g de protéines",
   "Tour de taille mesuré chaque semaine",
   "Sommeil 8 h, coucher 22h30"
 ]},
 {n:"APPARENCE", c:"#f472b6", ob:"Net, pas méconnaissable", its:[
   "Coiffeur : côtés 2-3 cm, dessus texturé, pas de gel",
   "Sourcils : seulement entre les deux",
   "Nettoyant, hydratant, solaire 50 chaque jour",
   "Miel 2x par semaine, argile 1x sur le front",
   "Rasé : le duvet clairsemé vieillit",
   "Cernes : 8 h de sommeil, moins de sel le soir"
 ]},
 {n:"TÊTE", c:"#34d399", ob:"Cerveau calme, pas d'écran fou", its:[
   "1 h de téléphone par jour maximum",
   "Pas d'écran après 20h la semaine",
   "Méditation 3 minutes le matin",
   "Méditation 10 minutes allongé le soir",
   "Lire 10 pages avant de dormir",
   "Journal le soir : ce que j'ai fait, la note du rêve"
 ]},
 {n:"DISCIPLINE", c:"#fb923c", ob:"Tenir 30 jours sans disparaître", its:[
   "Lever 7h, coucher 22h30",
   "Sport avant 20h",
   "Une séance de code par jour",
   "Le journal rempli chaque soir",
   "Une seule chose à la fois quand je la fais"
 ]},
 {n:"LES AUTRES", c:"#94a3b8", ob:"Famille, potes, respect", its:[
   "Ne pas raconter un projet, le montrer fini",
   "Rendre service sans compter, une fois par semaine",
   "Appeler un proche par semaine",
   "Tenir parole : ce qui est dit est fait"
 ]}
];
const K='listeChinoise_v1';
const st=JSON.parse(localStorage.getItem(K)||'{}');
const host=document.getElementById('branches');
host.innerHTML=BRANCHES.map((b,bi)=>{
  const items=b.its.map((t,ii)=>{
    const id=bi+'-'+ii, on=st[id];
    return `<label class="it ${on?'done':''}"><input type="checkbox" ${on?'checked':''} onchange="tog('${id}',this)"><span>${t}</span></label>`;
  }).join('');
  return `<div class="branch">
    <div class="bhead" onclick="this.nextElementSibling.classList.toggle('open')">
      <span class="dot" style="background:${b.c}"></span>
      <b>${b.n}</b><small>${b.ob}</small>
    </div>
    <div class="items ${bi===0?'open':''}">${items}</div>
  </div>`;
}).join('');
function tog(id,el){
  st[id]=el.checked; localStorage.setItem(K,JSON.stringify(st));
  el.parentElement.classList.toggle('done', el.checked);
}
</script>
</body>
</html>
